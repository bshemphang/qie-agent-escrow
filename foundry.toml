[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "paris"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
qie_testnet = "https://rpc2testnet.qie.digital"
qie_mainnet = "https://rpc1mainnet.qie.digital"

[etherscan]
qie_testnet = { key = "verifyContract", chain = 1983, url = "https://testnet.qie.digital/api/" }
qie_mainnet = { key = "verifyContract", chain = 1990, url = "https://mainnet.qie.digital/api/" }
